<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla Model 3</title>
  <link rel="stylesheet" href="css/up.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <nav class="navbar">
        <div class="logo-container">
          <img src="asset/logo/teslaLogo.png" alt="Tesla logo" class="teslaLogo" />
        </div>

      <div class="center-nav-container">
        <ul class="menu-list center-menu">
          <li><a href="#">Vehicles</a></li>
          <li><a href="#">Energy</a></li>
          <li><a href="#">Charging</a></li>
          <li><a href="#">Discover</a></li>
          <li><a href="#">Shop</a></li>
        </ul>
      </div>

      <div class="right-nav-container">
        <ul class="menu-list right-menu">
          <li><a href="#"><i class="far fa-circle-question"></i></a></li>
          <li><a href="#"><i class="fas fa-globe"></i></a></li>
          <li><a href="#"><i class="far fa-user"></i></a></li>
        </ul>
      </div>
    </nav>
  </header>

  <div class="model-switcher">
    <!-- Model 3 Performance -->
    <div class="hero-section active" id="performance">
      <div class="hero-content left-aligned">
        <h1>Model 3</h1>
        <p>Performance</p>
        <div class="hero-buttons">
          <a href="#" class="order-now">Order Now</a>
          <a href="#" class="learn-more">Learn More</a>
          <button class="switch-model" data-target="longrange">Switch to Long Range</button>
        </div>
      </div>
    </div>

    <!-- Model 3 Long Range -->
    <div class="hero-section" id="longrange">
      <div class="hero-content left-aligned">
        <h1>Model 3</h1>
        <p>Long Range</p>
        <div class="hero-buttons">
          <a href="#" class="order-now">Order Now</a>
          <a href="#" class="learn-more">Learn More</a>
          <button class="switch-model" data-target="performance">Switch to Performance</button>
        </div>
      </div>
    </div>
  </div> 

  <script src="js/vechile.js"></script>
</body>
</html>
